[project]
name = "whisper-large-v3-studio"
version = "0.1.0"
description = "Drop an audio file, get timestamped text and subtitles. Runs Whisper large-v3 on your own machine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.18",
  # NVIDIA GPUs and CPUs run the CTranslate2 conversion of large-v3.
  "faster-whisper>=1.1",
  # Apple Silicon runs the MLX conversion of the same weights on its GPU.
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
whisper-studio = "whisper_studio.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
