<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whisper large-v3 Studio</title>
    <link rel="stylesheet" href="/lite/style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">letsrunai · open model, your machine</p>
        <h1>Whisper large-v3 Studio</h1>
        <p class="lead">Drop an audio or video file. Get timestamped text and subtitles. Nothing leaves this computer.</p>
      </header>

      <form id="form">
        <label id="drop" class="drop" for="file">
          <input id="file" name="file" type="file" accept="audio/*,video/*" required />
          <strong id="drop-title">Drop a file here or click to choose</strong>
          <span id="drop-hint">mp3, wav, m4a, mp4, webm… anything ffmpeg reads</span>
        </label>

        <div class="options">
          <label>
            Language
            <select id="language" name="language">
              <option value="">Detect</option>
              <option value="en">English</option>
              <option value="tr">Turkish</option>
              <option value="de">German</option>
              <option value="fr">French</option>
              <option value="es">Spanish</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="nl">Dutch</option>
              <option value="ru">Russian</option>
              <option value="ar">Arabic</option>
              <option value="hi">Hindi</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
              <option value="zh">Chinese</option>
            </select>
          </label>
          <fieldset>
            <legend>Output</legend>
            <label><input type="radio" name="task" value="transcribe" checked /> Same language</label>
            <label><input type="radio" name="task" value="translate" /> Translate to English</label>
          </fieldset>
          <button id="run" type="submit">Transcribe</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="result" class="result" hidden>
        <dl class="stats">
          <div><dt>Language</dt><dd id="stat-language"></dd></div>
          <div><dt>Audio</dt><dd id="stat-duration"></dd></div>
          <div><dt>Took</dt><dd id="stat-elapsed"></dd></div>
          <div><dt>Speed</dt><dd id="stat-speed"></dd></div>
          <div><dt>Ran on</dt><dd id="stat-device"></dd></div>
        </dl>

        <div class="toolbar">
          <button type="button" id="copy">Copy text</button>
          <button type="button" data-download="txt">Download .txt</button>
          <button type="button" data-download="srt">Download .srt</button>
          <button type="button" data-download="vtt">Download .vtt</button>
        </div>

        <ol id="segments" class="segments"></ol>
      </section>
    </main>
    <footer>
      Model: <a href="https://huggingface.co/openai/whisper-large-v3" target="_blank" rel="noopener">openai/whisper-large-v3</a>
      (Apache-2.0) · Code: <a href="https://github.com/letsrunai/whisper-large-v3-studio" target="_blank" rel="noopener">letsrunai/whisper-large-v3-studio</a>
    </footer>
    <script src="/lite/app.js"></script>
  </body>
</html>
